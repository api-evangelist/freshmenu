name: Freshmenu
description: >-
  FreshMenu is a Bengaluru-based full-stack food-technology company that operates
  its own cloud kitchens and cooks, packages, and delivers a daily-changing menu of
  fresh gourmet meals directly to consumers. Unlike aggregator marketplaces, FreshMenu
  owns the end-to-end experience — from culinary R&D and kitchen operations to its
  consumer ordering website and mobile apps — serving Bengaluru, Mumbai, and the
  Delhi/NCR region (New Delhi and Gurgaon). The company is backed by Lightspeed
  Venture Partners and was surfaced into the API Evangelist network as a portfolio
  lead. It publishes a consumer ordering experience but no public API or developer
  program; this profile captures its identity and infrastructure posture for the
  enrichment pipeline.
